<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Wave Hack Story</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ストーリーズ画像（1080x1920）。上端はプロフィール表示、下端は返信欄が重なるので、文字は y=280〜1580 に収める。
   色はデザインレギュレーション v1 準拠。score 55 以上だけ azure。 */
:root{--ink:#071a3a;--azure:#0877f9;--muted:#52627a;--faint:#718096;--line:#dce5ef;--hl:#eef6ff;--low:#9aa9bd;
  --jp:"Zen Kaku Gothic New",sans-serif;--num:"Inter Tight",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:var(--jp);color:var(--ink);
  background:linear-gradient(180deg,#cfe8ff 0%,#eef7ff 45%,#ffffff 100%)}
.wrap{position:absolute;left:80px;right:80px;top:290px;bottom:340px;display:flex;flex-direction:column}
.brand{font:800 28px/1 var(--num);letter-spacing:8px;color:var(--azure)}
.pill{align-self:flex-start;margin-top:26px;height:64px;padding:0 30px;border-radius:999px;background:var(--ink);color:#fff;font:900 32px/64px var(--jp)}
h1{margin-top:30px;font:900 104px/1.15 var(--jp);letter-spacing:-3px}
h1 small{display:block;font:900 40px/1.3 var(--jp);color:var(--azure);letter-spacing:0;margin-bottom:10px}
.pts{margin-top:56px;display:grid;gap:26px}
.pt{display:flex;align-items:center;gap:24px;padding:44px 40px;border-radius:34px;background:#fff;border:1px solid var(--line);box-shadow:0 14px 34px rgba(7,28,59,.08);font:900 46px/1.3 var(--jp)}
.pt i{flex:none;width:68px;height:68px;border-radius:50%;background:var(--azure);color:#fff;font:900 38px/68px var(--num);text-align:center;font-style:normal}
.pt b{color:var(--azure)}
.foot{margin-top:auto;padding:34px 38px;border-radius:34px;background:var(--ink);color:#fff;font:900 42px/1.4 var(--jp)}
.foot span{display:block;margin-top:8px;font:700 30px/1.4 var(--jp);color:#b9c9de}
/* 週末予報 */
.period{align-self:flex-start;margin-top:22px;height:64px;padding:0 30px;border-radius:999px;background:var(--ink);color:#fff;font:800 34px/64px var(--num)}
.rows{margin-top:26px;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:22px;padding:10px 24px;border-radius:26px;background:#fff;border:1px solid var(--line)}
.row.good{border:4px solid var(--azure)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font:900 38px/1.15 var(--jp);white-space:nowrap}
.row .nm small{display:block;margin-top:4px;font:700 26px/1.2 var(--jp);color:var(--muted);white-space:nowrap}
.row .bt{text-align:right;font:800 28px/1.3 var(--jp);color:var(--muted);white-space:nowrap}
.row .bt b{display:block;font:900 32px/1.2 var(--jp);color:var(--ink)}
.row .sc{flex:none;width:80px;height:80px;border-radius:50%;background:var(--low);color:#fff;display:flex;align-items:center;justify-content:center;font:900 40px/1 var(--num)}
.row.good .sc{background:var(--azure)}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
const S = window.__STORY__, wrap = document.getElementById("wrap");
const pad = n => String(n).padStart(2, "0");
if (S.mode === "edu") {
  const E = S.ep, sum = E.scenes.find(s => s.kind === "sum");
  wrap.innerHTML = `<div class="brand">WAVE HACK</div><div class="pill">新しいリールを公開</div>
    <h1><small>${E.series} #${pad(E.no)}</small>${E.title}</h1>
    <div class="pts">${sum.points.map((p, i) => `<div class="pt"><i>${i + 1}</i><span>${p}</span></div>`).join("")}</div>
    <div class="foot">くわしくはプロフィールのリールで${E.next ? `<span>次回 #${pad(E.no + 1)}「${E.next}」｜毎日18時更新（木曜はお休み）</span>` : `<span>シリーズ全10回、保存して見返してね</span>`}</div>`;
} else {
  const rows = S.points.map(P => {
    const [k, s] = ["sat", "sun"].flatMap(d => P.days[d].map(x => [d, x])).reduce((a, b) => b[1].score > a[1].score ? b : a);
    const good = s.score >= 55, h = +s.t.slice(0, 2);
    const when = `${k === "sat" ? "土" : "日"} ${h}時`;
    return `<div class="row${good ? " good" : ""}"><div class="nm"><b>${P.name}</b><small>${P.group}</small></div>
      <div class="bt">ベスト<b>${when}</b></div><div class="sc">${s.score}</div></div>`;
  }).join("");
  wrap.innerHTML = `<div class="brand">WAVE HACK</div><h1 style="font-size:76px;margin-top:16px">今週末の波予想</h1>
    <div style="display:flex;align-items:center;gap:20px"><div class="period">${S.period}</div><div style="margin-top:22px;font:700 28px/1.35 var(--jp);color:var(--muted)">各地点の土日ベスト｜<b style="color:var(--azure)">55以上</b>がおすすめ<br>地点ごとの解説リールは19時から</div></div><div class="rows">${rows}</div>`;
}
window.__storyReady = true;
</script>
</body>
</html>
