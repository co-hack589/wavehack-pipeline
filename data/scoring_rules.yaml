  low_slack:    { ja: "干潮どまり", ja_long: "干潮ピーク（動き止まり）" }


# ============================================================
# 8) 予報レンジ（信頼度）ラベル
# ============================================================
#
# GFS Wave は fhour <= 120 (5日先) までを信頼レンジ、それ以降は参考値扱い。
# UI / コメント生成で「参考値」表示に切り替えるための閾値。
#
forecast_range:
  reliable_until_fhour: 120     # ここまで（=ちょうど5日先）を信頼レンジ
  extended_until_fhour: 168     # ここまで（=7日先）参考値として表示
  labels:
    reliable: { ja: "予報",   ja_long: "予報レンジ（〜5日先）" }
    extended: { ja: "参考値", ja_long: "参考値レンジ（5〜7日先・精度低下）" }


