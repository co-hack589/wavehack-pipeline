  mid_flood:    { ja: "上げ7分", ja_long: "上げ潮の中盤" }
  high_to_ebb:  { ja: "満潮〜引き始め", ja_long: "満潮ピーク直後の動き出し" }
  low_to_flood: { ja: "干潮〜上げ始め", ja_long: "干潮ピーク直後の動き出し" }
  mid_ebb:      { ja: "下げ7分", ja_long: "下げ潮の中盤" }
