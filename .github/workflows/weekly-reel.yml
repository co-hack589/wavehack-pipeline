name: weekly-reel

# ---------------------------------------------------------------------------
# 毎週木曜「週末の波予想」リール（主要9地点）を生成し、19:00 JST から15分おきに Instagram へ投稿する。
#   R2 dashboard.json → reel/build_reel_data.py → reel/narration_scenes.py（Gemini TTS Aoede）
#   → reel/render_reel.py（Chrome でコマ撮り + ffmpeg）→ reel/publish_reels.py（resumable upload）
#
# 必要な Secrets:
#   CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN — daily-update と共通（R2 読み取り）
#   GEMINI_API_KEY                               — ナレーション（Gemini TTS）
#   IG_USER_ID / IG_ACCESS_TOKEN                 — Instagram ビジネスアカウント ID / Facebook ページトークン
# 任意の Variables:
#   WEEKLY_REEL_ENABLED — 'true' のときだけ schedule 実行で投稿（停止スイッチ）
#
# 17:40 JST 開始の理由: Gemini 無料枠の日次上限は太平洋時間 0 時（JST 16:00）にリセット、
# daily-update（16:00 JST 開始、60〜90分）の結果があれば使えるため。
# ---------------------------------------------------------------------------

on:
  schedule:
    # GitHub の定期実行は混雑時に大きく遅れる（2026-10-08 は7時間遅延）ため予備を2本置く。
    # 投稿済みのポイントは publish_reels.py がスキップするので二重投稿にはならない。
    - cron: '40 8 * * 4'   # 木曜 UTC 08:40 = JST 17:40
    - cron: '10 9 * * 4'   # 予備 JST 18:10
    - cron: '50 9 * * 4'   # 予備 JST 18:50
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せず動画とキャプションだけ作る（artifact で確認）'
        type: boolean
        default: true
      post_now:
        description: '19:00 を待たずにすぐ投稿を始める'
        type: boolean
        default: false
      points:
        description: '対象ポイント（空なら9地点すべて。例: 木崎浜 志田下）'
        type: string
        default: ''
      silent:
        description: 'ナレーションを無音で代用（Gemini の枠を使わない動作確認用。投稿はされない）'
        type: boolean
        default: false

concurrency:
  group: weekly-reel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: github.event_name == 'workflow_dispatch' || vars.WEEKLY_REEL_ENABLED == 'true'
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WORK: ${{ github.workspace }}/work
      POINTS: ${{ inputs.points }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Japanese fonts (web font fallback)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null

      - name: Fetch production dashboard.json from R2
        run: |
          mkdir -p "$WORK"
          npx -y wrangler@4 r2 object get wavehack-data/dashboard.json --remote --file "$WORK/dashboard.json"

      - name: Build weekend data
        run: uv run --extra social python reel/build_reel_data.py --dashboard "$WORK/dashboard.json" --out "$WORK/reel_data.json"

      - name: Narration (Gemini TTS)
        # 失敗したポイントは動画化されずスキップ（Linux には macOS Kyoko の代替が無い）
        run: python3 reel/narration_scenes.py --data "$WORK/reel_data.json" --out-dir "$WORK/voice" ${{ inputs.silent && '--silent' || '' }} $POINTS || true

      - name: Render videos
        run: |
          uv run --with playwright --with imageio-ffmpeg python reel/render_reel.py \
            --data "$WORK/reel_data.json" --voice-dir "$WORK/voice" --out-dir "$WORK/videos" $POINTS
          ls -la "$WORK/videos"

      - name: Captions (dry run)
        run: python3 reel/publish_reels.py --data "$WORK/reel_data.json" --video-dir "$WORK/videos" --dry-run $POINTS

      - uses: actions/upload-artifact@v4
        with:
          name: weekly-reel-${{ github.run_id }}
          path: |
            work/reel_data.json
            work/videos/
          retention-days: 14

      - name: Wait until 19:00 JST (Thursday of this weekend)
        id: wait
        if: ${{ !inputs.dry_run && !inputs.silent }}
        run: |
          python3 - <<'EOF'
          # 基準は「対象の土曜の2日前（木曜）19:00」。実行が遅れて過ぎていれば待たずに投稿、
          # 土曜 9:00 を過ぎていれば週末の予報としては遅すぎるので投稿しない。
          import datetime, json, os, time
          jst = datetime.timezone(datetime.timedelta(hours=9))
          sat = datetime.date.fromisoformat(json.load(open(os.environ["WORK"] + "/reel_data.json"))["saturday"])
          start = datetime.datetime.combine(sat - datetime.timedelta(days=2), datetime.time(19, 0), jst)
          deadline = datetime.datetime.combine(sat, datetime.time(9, 0), jst)
          now = datetime.datetime.now(jst)
          post_now = os.environ.get("POST_NOW") == "true"
          ok = "true"
          if now >= deadline:
              print(f"{now:%m/%d %H:%M} は投稿期限 {deadline:%m/%d %H:%M} を過ぎているので投稿しない"); ok = "false"
          elif now < start and not post_now:
              print(f"{start:%m/%d %H:%M} まで {(start - now).total_seconds():.0f} 秒待つ"); time.sleep((start - now).total_seconds())
          else:
              print("待たずに投稿する")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"publish={ok}\n")
          EOF
        env:
          POST_NOW: ${{ inputs.post_now }}

      - name: Publish reels (19:00〜 15分おき)
        if: ${{ !inputs.dry_run && !inputs.silent && steps.wait.outputs.publish == 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: v26.0
        run: |
          python3 reel/publish_reels.py --data "$WORK/reel_data.json" --video-dir "$WORK/videos" \
            --interval-min 15 --log "$WORK/published.jsonl" $POINTS
          cat "$WORK/published.jsonl"
