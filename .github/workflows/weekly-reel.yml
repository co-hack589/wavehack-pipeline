name: weekly-reel

# ---------------------------------------------------------------------------
# 毎週木曜「週末の波予想」リール（主要9地点）を生成し、19:00 JST から15分おきに Instagram へ投稿する。
#   R2 dashboard.json → reel/build_reel_data.py → reel/narration_scenes.py（Gemini TTS Aoede、枠切れ時は Cloud TTS Autonoe）
#   → reel/render_reel.py（Chrome でコマ撮り + ffmpeg）→ reel/publish_reels.py（resumable upload）
#
# 必要な Secrets:
#   CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN — daily-update と共通（R2 読み取り）
#   GEMINI_API_KEY                               — ナレーション（Gemini TTS）
#   IG_USER_ID / IG_ACCESS_TOKEN                 — Instagram ビジネスアカウント ID / Facebook ページトークン
# Gemini 無料枠（1日約21回）が尽きた地点は Cloud TTS（Chirp 3 HD Autonoe）で作る。Workload Identity 連携でキーなし認証（GCP wavehack-501114 / SA reel-tts、このリポジトリからのみ利用可）。
# 任意の Variables:
#   WEEKLY_REEL_ENABLED — 'true' のときだけ schedule 実行で投稿（停止スイッチ）
#
# ジョブ構成: build（動画生成）→ hold（19:00 まで待つ前半）→ publish（残りを待って 19:00 から投稿）。
#   GitHub の定期実行は数時間遅れることがあるため（10/8 は7時間、10/15 は5時間）、朝から何度も起動して
#   早めに動画を作っておく。1ジョブは最長6時間なので、19:00 までの待ちを hold と publish に分けている。
#   最初の実行が 19:00 まで待っている間、後続の起動は concurrency で待機し、順番が来たら
#   publish_reels.py --pending で「今週の未投稿ポイント」だけを対象にする（全部投稿済みなら何もせず終わる）。
#   このため途中で失敗しても、次の起動が残りだけを作り直して投稿する（Gemini の枠も残りの分しか使わない）。
# ---------------------------------------------------------------------------

on:
  schedule:
    # 木曜 JST 09:17 / 11:17 / 13:17 / 15:17 / 17:47。毎時0分は混雑して遅れやすいのでずらす。
    # 17:47 の回は Gemini 無料枠のリセット（JST 16:00）後なので、それまでの回で枠を使い切っても音声を作れる。
    - cron: '17 0 * * 4'
    - cron: '17 2 * * 4'
    - cron: '17 4 * * 4'
    - cron: '17 6 * * 4'
    - cron: '47 8 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せず動画とキャプションだけ作る（artifact で確認）'
        type: boolean
        default: true
      post_now:
        description: '19:00 を待たずにすぐ投稿を始める'
        type: boolean
        default: false
      points:
        description: '対象ポイント（空なら9地点すべて。例: 木崎浜 志田下）'
        type: string
        default: ''
      silent:
        description: 'ナレーションを無音で代用（Gemini の枠を使わない動作確認用。投稿はされない）'
        type: boolean
        default: false

concurrency:
  group: weekly-reel
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # Workload Identity 連携で GCP のアクセストークンを得るため

env:
  # 手動実行で dry_run / silent のときは投稿しない（schedule では inputs が空なので投稿する）
  PUBLISH: ${{ !inputs.dry_run && !inputs.silent }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch' || vars.WEEKLY_REEL_ENABLED == 'true'
    outputs:
      pending: ${{ steps.pending.outputs.names }}
      saturday: ${{ steps.pending.outputs.saturday }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_API_VERSION: v26.0
      WORK: ${{ github.workspace }}/work
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Fetch production dashboard.json from R2
        run: |
          mkdir -p "$WORK"
          npx -y wrangler@4 r2 object get wavehack-data/dashboard.json --remote --file "$WORK/dashboard.json"

      - name: Build weekend data
        run: uv run --extra social python reel/build_reel_data.py --dashboard "$WORK/dashboard.json" --out "$WORK/reel_data.json"

      - name: Pick points not yet posted this week
        id: pending
        env:
          POINTS: ${{ inputs.points }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            names=$(python3 reel/publish_reels.py --data "$WORK/reel_data.json" --pending $POINTS)
          elif [ -n "$POINTS" ]; then
            names="$POINTS"
          else
            names=$(python3 -c 'import json,sys; print(" ".join(p["name"] for p in json.load(open(sys.argv[1]))["points"]))' "$WORK/reel_data.json")
          fi
          echo "対象: ${names:-なし（今週分は投稿済み）}"
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "saturday=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["saturday"])' "$WORK/reel_data.json")" >> "$GITHUB_OUTPUT"

      - name: Japanese fonts (web font fallback)
        if: steps.pending.outputs.names != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null

      - name: Authenticate to Google Cloud (Text-to-Speech)
        id: gcp
        if: steps.pending.outputs.names != '' && !inputs.silent
        continue-on-error: true  # 失敗したらトークンが空になり、枠切れ時の代替が無くなるだけ（Gemini では作る）
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/231882021295/locations/global/workloadIdentityPools/github/providers/wavehack-pipeline
          service_account: reel-tts@wavehack-501114.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false

      - name: Narration (Gemini TTS, fallback Cloud TTS Autonoe)
        # 失敗したポイントは動画化されずスキップ（Linux には macOS Kyoko の代替が無い）。次の起動で作り直す
        if: steps.pending.outputs.names != ''
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: python3 reel/narration_scenes.py --data "$WORK/reel_data.json" --out-dir "$WORK/voice" ${{ inputs.silent && '--silent' || '' }} ${{ steps.pending.outputs.names }} || true

      - name: Render videos
        if: steps.pending.outputs.names != ''
        run: |
          uv run --with playwright --with imageio-ffmpeg python reel/render_reel.py \
            --data "$WORK/reel_data.json" --voice-dir "$WORK/voice" --out-dir "$WORK/videos" ${{ steps.pending.outputs.names }}
          ls -la "$WORK/videos"

      - name: Render covers
        if: steps.pending.outputs.names != ''
        run: uv run --with playwright python reel/render_cover.py --data "$WORK/reel_data.json" --out-dir "$WORK/covers" ${{ steps.pending.outputs.names }}

      - name: Story image (9 points summary)
        if: steps.pending.outputs.names != ''
        run: uv run --with playwright python reel/render_story.py --week "$WORK/reel_data.json" --out "$WORK/story.jpg"

      - name: Captions (dry run)
        if: steps.pending.outputs.names != ''
        run: python3 reel/publish_reels.py --data "$WORK/reel_data.json" --video-dir "$WORK/videos" --dry-run ${{ steps.pending.outputs.names }}

      - uses: actions/upload-artifact@v4
        if: steps.pending.outputs.names != ''
        with:
          name: weekly-reel-${{ github.run_id }}
          path: |
            work/reel_data.json
            work/videos/
            work/covers/
            work/story.jpg
          retention-days: 14

  hold:
    # 朝に起動した場合、19:00 まで最大 5時間40分 ここで待つ（残りは publish ジョブで待つ）
    needs: build
    if: needs.build.outputs.pending != '' && !inputs.dry_run && !inputs.silent
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Wait (first half)
        run: python3 reel/wait_until_post.py --saturday ${{ needs.build.outputs.saturday }} --cap 20400 ${{ inputs.post_now && '--now' || '' }}

  publish:
    needs: [build, hold]
    if: needs.build.outputs.pending != '' && !inputs.dry_run && !inputs.silent
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_API_VERSION: v26.0
      WORK: ${{ github.workspace }}/work
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: weekly-reel-${{ github.run_id }}
          path: work

      - name: Wait until 19:00 JST (Thursday of this weekend)
        id: wait
        run: python3 reel/wait_until_post.py --saturday ${{ needs.build.outputs.saturday }} ${{ inputs.post_now && '--now' || '' }}

      - name: Publish story (first run of the week only)
        # 未投稿が全地点＝この週の最初の投稿のときだけ。失敗してもリール投稿は続ける
        if: steps.wait.outputs.publish == 'true'
        continue-on-error: true
        env:
          PENDING: ${{ needs.build.outputs.pending }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          sys.path.insert(0, "reel")
          from publish_reels import publish_story
          data = json.load(open(os.environ["WORK"] + "/reel_data.json"))
          if len(os.environ["PENDING"].split()) < len(data["points"]):
              print("今週はすでに投稿を始めているのでストーリーズは出さない"); raise SystemExit(0)
          print("story", publish_story(__import__("pathlib").Path(os.environ["WORK"] + "/story.jpg"), f"story-week-{data['saturday']}.jpg"))
          EOF

      - name: Publish reels (19:00〜 15分おき)
        if: steps.wait.outputs.publish == 'true'
        run: |
          python3 reel/publish_reels.py --data "$WORK/reel_data.json" --video-dir "$WORK/videos" \
            --cover-dir "$WORK/covers" --interval-min 15 --log "$WORK/published.jsonl" ${{ needs.build.outputs.pending }}
          cat "$WORK/published.jsonl"

  notify-failure:
    needs: [build, hold, publish]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/slack-alert
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          text: "Instagram 週次リール (weekly-reel) が失敗しました"
