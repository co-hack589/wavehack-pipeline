name: morning-notifications

# ---------------------------------------------------------------------------
# 1日2回 POST /internal/send-notifications を叩き、通知設定（時間帯・曜日・
# いつ知らせるか・基準点）に合うユーザーへプッシュ通知・メールを送る。
#   JST 05:30 … phase=morning（今日の波）
#   JST 20:00 … phase=evening（明日の波・3日後の見込み）
# 同じ波を二度送らない判定は API 側（notification_events）。再実行しても重複しない。
#
# - 実処理は wavehack-api 側（Bearer = WAVEHACK_CRON_SECRET を検証）。
# - このワークフローはメール失敗でも exit 0（daily-update と独立に成功扱い）。
# - 朝は daily-update.yml (04:00) の後、夜は 16:00 更新の後に走る。
#
# 必要な Secrets（同リポジトリの Settings → Secrets and variables → Actions）:
#   WAVEHACK_CRON_SECRET — Render 側 env と一致させる共有秘密
#   WAVEHACK_API_URL     — 例: https://wavehack-api.onrender.com
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '30 20 * * *'   # UTC 20:30 = JST 05:30 → morning
    - cron: '0 11 * * *'    # UTC 11:00 = JST 20:00 → evening
  workflow_dispatch:
    inputs:
      phase:
        description: "morning（今日の波）/ evening（明日・3日後）"
        required: true
        default: evening
        type: choice
        options: [morning, evening]

concurrency:
  group: morning-notifications
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trigger send endpoint
        id: send
        env:
          API_URL: ${{ secrets.WAVEHACK_API_URL }}
          CRON_SECRET: ${{ secrets.WAVEHACK_CRON_SECRET }}
          # 手動実行は入力値、定時実行は cron の時刻で決める
          PHASE: ${{ github.event.inputs.phase || (github.event.schedule == '30 20 * * *' && 'morning' || 'evening') }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::WAVEHACK_API_URL / WAVEHACK_CRON_SECRET が未設定です。スキップします。"
            exit 0
          fi
          # 失敗しても workflow 全体は成功扱い（メール障害でパイプラインを止めない）。
          set +e
          RESPONSE=$(curl -sS -m 60 -o /tmp/notify.json -w "%{http_code}" \
            -X POST "$API_URL/internal/send-notifications" \
            -H "authorization: Bearer $CRON_SECRET" \
            -H "content-type: application/json" \
            -d "{\"phase\":\"$PHASE\"}")
          echo "phase: $PHASE"
          RC=$?
          echo "HTTP status: $RESPONSE (curl rc=$RC)"
          echo "--- response body ---"
          cat /tmp/notify.json || true
          echo ""
          ERRORS=$(python3 -c "import json;print(json.load(open('/tmp/notify.json')).get('errors',0))" 2>/dev/null || echo 0)
          if [ "$RC" -ne 0 ] || [ "$RESPONSE" -ge 400 ] || [ "$ERRORS" != "0" ]; then
            echo "::warning::morning-notifications 送信で失敗またはサーバエラー (HTTP $RESPONSE, errors=$ERRORS)。翌日の cron に任せます。"
            echo "failed=HTTP $RESPONSE / curl rc=$RC / errors=$ERRORS" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Notify Slack on failure
        if: steps.send.outputs.failed != ''
        uses: ./.github/actions/slack-alert
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          text: "波の通知送信 (morning-notifications) が失敗しました (${{ steps.send.outputs.failed }})"
