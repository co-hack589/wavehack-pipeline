name: morning-notifications

# ---------------------------------------------------------------------------
# 毎朝 JST 06:30 に POST /internal/send-morning-notifications を叩き、
# コンディションアラート設定に合致するユーザーへメール送信する。
#
# - 実処理は wavehack-api 側（Bearer = WAVEHACK_CRON_SECRET を検証）。
# - このワークフローはメール失敗でも exit 0（daily-update と独立に成功扱い）。
# - daily-update.yml (04:00) の後にデータが揃っている前提で 06:30 に走らせる。
#
# 必要な Secrets（同リポジトリの Settings → Secrets and variables → Actions）:
#   WAVEHACK_CRON_SECRET — Render 側 env と一致させる共有秘密
#   WAVEHACK_API_URL     — 例: https://wavehack-api.onrender.com
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '30 21 * * *'   # UTC 21:30 = JST 06:30
  workflow_dispatch: {}

concurrency:
  group: morning-notifications
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trigger send endpoint
        id: send
        env:
          API_URL: ${{ secrets.WAVEHACK_API_URL }}
          CRON_SECRET: ${{ secrets.WAVEHACK_CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::WAVEHACK_API_URL / WAVEHACK_CRON_SECRET が未設定です。スキップします。"
            exit 0
          fi
          # 失敗しても workflow 全体は成功扱い（メール障害でパイプラインを止めない）。
          set +e
          RESPONSE=$(curl -sS -m 60 -o /tmp/notify.json -w "%{http_code}" \
            -X POST "$API_URL/internal/send-morning-notifications" \
            -H "authorization: Bearer $CRON_SECRET" \
            -H "content-type: application/json" \
            -d '{}')
          RC=$?
          echo "HTTP status: $RESPONSE (curl rc=$RC)"
          echo "--- response body ---"
          cat /tmp/notify.json || true
          echo ""
          ERRORS=$(python3 -c "import json;print(json.load(open('/tmp/notify.json')).get('errors',0))" 2>/dev/null || echo 0)
          if [ "$RC" -ne 0 ] || [ "$RESPONSE" -ge 400 ] || [ "$ERRORS" != "0" ]; then
            echo "::warning::morning-notifications 送信で失敗またはサーバエラー (HTTP $RESPONSE, errors=$ERRORS)。翌日の cron に任せます。"
            echo "failed=HTTP $RESPONSE / curl rc=$RC / errors=$ERRORS" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Notify Slack on failure
        if: steps.send.outputs.failed != ''
        uses: ./.github/actions/slack-alert
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          text: "朝のコンディションメール送信 (morning-notifications) が失敗しました (${{ steps.send.outputs.failed }})"
