name: edu-series

# ---------------------------------------------------------------------------
# 教育シリーズ「波予報の読み方」を、木曜以外の 18:00 JST に1日1本までリールで投稿する。
# 第1弾（edu/episodes/ep01〜10.json）は 10/31 に完了。第2弾（#11〜）は運営者が Slack で許可した台本だけを出す:
#   publish_edu.py --next で wavehack-api の GET /social/ideas/next?kind=edu から次の回を取る（今日すでに投稿済み・
#   許可済みの台本が無ければ何もしない。前日に予告したまま見送った回があればそちらが先）→ edu/out/epNN.json
#   → render_edu.py（Gemini TTS Aoede、失敗時は Cloud TTS Autonoe → Chrome でコマ撮り）
#   → POST /social/ideas/:id/preview（動画の URL と予定時刻。API が Slack に予告を出し、運営者は止められる）
#   → 18:00 まで待つ → 直前に GET /social/ideas/:id で状態を確かめ、preview のときだけ投稿 → POST /posted（失敗は /failed）
#   → 続けてその回の要点をストーリーズに1枚（reel/render_story.py --edu、画像は R2 social/ 経由で公開）
# 木曜は週末の波予想リール（weekly-reel.yml）の日なので休み。
#
# Secrets: GEMINI_API_KEY / IG_USER_ID / IG_ACCESS_TOKEN / CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN（weekly-reel と共通）
#          WAVEHACK_API_URL / WAVEHACK_CRON_SECRET（morning-notifications と共通）
# Variables: EDU_SERIES_ENABLED — 'true' のときだけ schedule 実行で投稿（停止スイッチ）
#            EDU_PREVIEW_MODE — 予告の動画 URL。run（既定: この実行のページ＝artifact）/ r2（/api/social が mp4 に対応してから）
# GitHub の定期実行は数時間遅れることがあるため（10/18 は約4時間）、朝 9:17 から起動して早めに動画を作っておく。
#   ジョブ構成: build（動画生成）→ hold（18:00 まで待つ前半）→ publish（残りを待って投稿）。1ジョブは最長6時間のため分割。
#   後続の起動は concurrency で待機し、順番が来た時点で今日投稿済みなら何もせず終わる。
# ---------------------------------------------------------------------------

on:
  schedule:
    # JST 09:17 / 11:17 / 13:17 / 15:17 / 16:47（日〜水・金・土）。UTC でも同じ曜日
    - cron: '17 0 * * 0,1,2,3,5,6'
    - cron: '17 2 * * 0,1,2,3,5,6'
    - cron: '17 4 * * 0,1,2,3,5,6'
    - cron: '17 6 * * 0,1,2,3,5,6'
    - cron: '47 7 * * 0,1,2,3,5,6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せず動画とキャプションだけ作る（artifact で確認）'
        type: boolean
        default: true
      post_now:
        description: '18:00 を待たずにすぐ投稿する'
        type: boolean
        default: false
      idea_id:
        description: 'API の idea id を指定（確認用）。空なら許可済みで最も古い回'
        type: string
        default: ''

concurrency:
  group: edu-series
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # Workload Identity 連携で Cloud TTS（Gemini 失敗時の代替）を使うため

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' || vars.EDU_SERIES_ENABLED == 'true'
    outputs:
      id: ${{ steps.pick.outputs.id }}
      ep: ${{ steps.pick.outputs.ep }}
      name: ${{ steps.pick.outputs.name }}
      date: ${{ steps.pick.outputs.date }}
      previewed: ${{ steps.preview.outputs.previewed }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_API_VERSION: v26.0
      WAVEHACK_API_URL: ${{ secrets.WAVEHACK_API_URL }}
      WAVEHACK_CRON_SECRET: ${{ secrets.WAVEHACK_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Pick episode
        id: pick
        env:
          IDEA_ID: ${{ inputs.idea_id }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          # 遅れた起動が木曜（週末の波予想の日）にずれ込んだら休む
          if [ -z "$IDEA_ID" ] && [ "$(TZ=Asia/Tokyo date +%u)" = 4 ]; then echo "木曜は休み"; exit 0; fi
          echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
          # 次の回を API から取り edu/out/epNN.json を書く（id / ep / name を GITHUB_OUTPUT へ）。無ければ ep は空
          python3 edu/publish_edu.py --next ${IDEA_ID:+--idea-id "$IDEA_ID"} $DRY

      - name: Japanese fonts (web font fallback)
        if: steps.pick.outputs.ep != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null

      - name: Authenticate to Google Cloud (Text-to-Speech fallback)
        id: gcp
        if: steps.pick.outputs.ep != ''
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/231882021295/locations/global/workloadIdentityPools/github/providers/wavehack-pipeline
          service_account: reel-tts@wavehack-501114.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false

      - name: Narration and video
        if: steps.pick.outputs.ep != ''
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          uv run --with playwright --with imageio-ffmpeg python edu/render_edu.py "${{ steps.pick.outputs.ep }}"
          uv run --with playwright python reel/render_story.py --edu "${{ steps.pick.outputs.ep }}" --out edu/out/story.jpg

      - name: Caption (dry run)
        if: steps.pick.outputs.ep != ''
        run: python3 edu/publish_edu.py --ep "${{ steps.pick.outputs.ep }}" --dry-run

      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.ep != ''
        with:
          name: edu-${{ github.run_id }}
          path: |
            edu/out/${{ steps.pick.outputs.name }}.mp4
            edu/out/${{ steps.pick.outputs.name }}.json
            edu/out/story.jpg
          retention-days: 14

      - name: Preview (API が Slack に予告を出す)
        id: preview
        if: steps.pick.outputs.ep != '' && !inputs.dry_run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EDU_PREVIEW_MODE: ${{ vars.EDU_PREVIEW_MODE || 'run' }}
        # 予定時刻は当日 18:00 JST（post_now なら今）。止められていれば previewed=false で hold・publish を飛ばす
        run: >-
          python3 edu/publish_edu.py --preview --id "${{ steps.pick.outputs.id }}" --ep "${{ steps.pick.outputs.ep }}"
          --video "edu/out/${{ steps.pick.outputs.name }}.mp4" --date "${{ steps.pick.outputs.date }}" ${{ inputs.post_now && '--now' || '' }}

  hold:
    # 朝に起動した場合、18:00 まで最大 5時間40分 ここで待つ（残りは publish ジョブで待つ）
    needs: build
    if: needs.build.outputs.previewed == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Wait (first half)
        run: python3 reel/wait_slot.py --date ${{ needs.build.outputs.date }} --at 18:00 --last 23:00 --cap 20400 ${{ inputs.post_now && '--now' || '' }}

  publish:
    needs: [build, hold]
    if: needs.build.outputs.previewed == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      WAVEHACK_API_URL: ${{ secrets.WAVEHACK_API_URL }}
      WAVEHACK_CRON_SECRET: ${{ secrets.WAVEHACK_CRON_SECRET }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_API_VERSION: v26.0
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: edu-${{ github.run_id }}
          path: edu/out

      - name: Wait until 18:00 JST
        id: wait
        # 23:00 を過ぎていたら今日は投稿しない（status=preview のまま残り、翌日の build が同じ回を先に出す）
        run: python3 reel/wait_slot.py --date ${{ needs.build.outputs.date }} --at 18:00 --last 23:00 ${{ inputs.post_now && '--now' || '' }}

      - name: Publish (reel + story)
        if: steps.wait.outputs.publish == 'true'
        # 直前に API の状態を確かめ、preview のときだけ投稿する（運営者が止めていれば何もせず正常終了）
        run: >-
          python3 edu/publish_edu.py --id "${{ needs.build.outputs.id }}" --ep "edu/out/${{ needs.build.outputs.name }}.json"
          --video "edu/out/${{ needs.build.outputs.name }}.mp4" --story edu/out/story.jpg

  notify-failure:
    needs: [build, hold, publish]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/slack-alert
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          text: "Instagram 教育シリーズ投稿 (edu-series) が失敗しました"
