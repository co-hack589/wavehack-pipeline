name: daily-update

# ---------------------------------------------------------------------------
# 毎日の予報更新パイプライン:
#   1. Docker で GFS 取得 → forecast.json / dashboard.json 生成 (~35分)
#   2. wavehack-api リポジトリの data/ にコミット → Render が自動再デプロイ
#   3. 検証済み dashboard.json を R2 へ配信（アプリはAPIから再取得）
#
# 必要な Secrets (このリポジトリの Settings → Secrets and variables → Actions):
#   WAVEHACK_API_PUSH_TOKEN — co-hack589/wavehack-api に Contents write 可能な
#                             Fine-grained PAT
#
# GFS は 00/06/12/18 UTC 発表。全期間の配信完了を確認して run を選ぶ。JST 朝サーフィンに間に合う
# よう 18UTC(=JST 03時) 発表分を 19:00 UTC (JST 04時) に取り、朝までに反映。
# ---------------------------------------------------------------------------

on:
  schedule:
    # 直近の全期間配信済み run を取得（公開途中の run は除外）。
    # 1日 2回 (18UTC 発表分を 19 UTC / 06UTC 発表分を 07 UTC = JST 04時/16時) 実行。
    - cron: '0 19 * * *'   # JST 04:00 (夕方 18UTC 発表分)
    - cron: '0 7 * * *'    # JST 16:00 (朝 06UTC 発表分)
  workflow_dispatch:
    inputs:
      workers:
        description: 'GFS 並列 workers (151pt では 2 推奨)'
        type: choice
        default: '2'
        options:
          - '4'
          - '2'
          - '1'
      hours_end:
        description: 'forecast hour 上限 (168=7日/72=3日/48=2日、slot数に線形)'
        type: choice
        default: '168'
        options:
          - '168'
          - '96'
          - '72'
          - '48'
          - '24'

concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 151pt 全国モードは 60-90分想定 (bump from 90)
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t wavehack-pipeline:ci .

      - name: Run pipeline
        run: |
          # コンテナは uid 10001 (wavehack) で走るため、mount 先を全書き込み可に
          mkdir -p out && chmod 777 out
          docker run --rm \
            -e OUTPUT_TARGET=local \
            -e POINTS_FILE=data/all_points.json \
            -e GFS_WORKERS="${{ inputs.workers || '2' }}" \
            -e GFS_HOURS_END="${{ inputs.hours_end || '168' }}" \
            -v "$PWD/out:/output" \
            wavehack-pipeline:ci
          ls -la out/data/

      # A regional/debug run must never replace the nationwide production feed.
      - name: Validate nationwide coverage before publishing
        run: python3 scripts/validate_dashboard.py out/data/dashboard.json

      - name: Checkout wavehack-api
        uses: actions/checkout@v4
        with:
          repository: co-hack589/wavehack-api
          token: ${{ secrets.WAVEHACK_API_PUSH_TOKEN }}
          path: api

      - name: Commit data to wavehack-api
        id: push_data
        run: |
          cp out/data/dashboard.json api/data/dashboard.json
          cp out/data/forecast.json  api/data/forecast.json
          cd api
          git config user.name "wavehack-bot"
          git config user.email "actions@wavehack.surf"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "データ変化なし、以降スキップ"
          else
            git commit -m "Update forecast data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 毎回配信し、前回R2だけ失敗した場合も再実行で回復する。
      # 予報更新ではフロントを再ビルドしない。
      - name: Upload dashboard.json to R2
        run: |
          npx wrangler@4 r2 object put wavehack-data/dashboard.json \
            --file out/data/dashboard.json \
            --content-type application/json \
            --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Wait for Render redeploy
        if: steps.push_data.outputs.changed == 'true'
        run: |
          NEW_GEN=$(python3 -c "import json;print(json.load(open('out/data/dashboard.json'))['generated_at'])")
          echo "新データ generated_at: $NEW_GEN"
          for i in $(seq 1 40); do
            LIVE=$(curl -s -m 20 https://wavehack-api.onrender.com/top3 | python3 -c "import json,sys;print(json.load(sys.stdin).get('generated_at',''))" 2>/dev/null || echo "")
            echo "[$i/40] live=$LIVE"
            if [ "$LIVE" = "$NEW_GEN" ]; then
              echo "Render 反映確認"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::Render 反映を20分待っても確認できず。R2の予報は更新済み"

  notify-failure:
    needs: [update]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/slack-alert
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          text: "予報更新パイプライン (daily-update) が失敗しました。予報が古いまま配信されている可能性があります"
